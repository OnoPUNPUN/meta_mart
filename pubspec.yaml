name: meta_mart
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  dio: ^5.11.0
  fpdart: ^1.2.0
  equatable: ^2.1.0
  path_provider: ^2.1.6
  drift: ^2.34.3
  drift_dev: ^2.34.5
  smooth_page_indicator: ^2.0.1
  flutter_secure_storage: ^10.3.1
  logger: ^2.7.0
  flutter_svg: ^2.3.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter_gen:
  output: lib/gen/
  line_length: 100
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# dart run build_runner build --delete-conflicting-outputs
